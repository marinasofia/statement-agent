[project]
name = "statement-agent"
version = "0.2.0"
description = "Extracts bank statement PDFs into a reconciled Excel workbook with Claude, with deterministic checks on every number the model returns."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "anthropic>=1.3,<2",
    "langgraph>=1.2,<2",
    "langchain-core>=1.0,<2",
    "pdfplumber>=0.11,<1",
    "pydantic>=2.11,<3",
    "openpyxl>=3.1,<4",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6.0,<7",
    "tenacity>=8.0,<10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agents", "agents.statement_extraction", "core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
