name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv pip install -e ".[dev]"
      - run: uv run --no-sync python -m pytest -q
      - name: Evals (replayed model responses, no API key)
        run: uv run --no-sync python -m evals.run_evals --mode replay
